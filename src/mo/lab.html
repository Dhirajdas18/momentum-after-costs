<form class="calc" id="ml" onsubmit="return false">
  <label>Lookback <select id="ml-look" name="lookback">
    <option value="3">3 months</option><option value="6">6 months</option><option value="12" selected>12 months</option>
  </select></label>
  <label>Skip the latest month <select id="ml-skip" name="skip">
    <option value="1" selected>yes</option><option value="0">no</option>
  </select></label>
  <label>Number of stocks <select id="ml-n" name="stocks">
    <option value="10">10</option><option value="20" selected>20</option><option value="30">30</option><option value="50">50</option>
  </select></label>
  <label>Rebalance every <select id="ml-reb" name="rebalance">
    <option value="1" selected>month</option><option value="3">3 months</option><option value="6">6 months</option>
  </select></label>
  <label>Cost per side, bp <input id="ml-cost" name="cost" type="number" min="0" max="200" step="1" value="30" inputmode="numeric" autocomplete="off" aria-describedby="ml-cost-help"></label>
  <label>Period <select id="ml-period" name="period">
    <option value="all" selected>all</option><option value="10y">last 10 years</option><option value="5y">last 5 years</option>
  </select></label>
</form>
<p class="note" id="ml-cost-help">Cost per side covers everything paid on each buy and each sell. Delivery STT alone is 0.1% of
the value on both sides, so 10 bp a side; stamp duty, exchange and SEBI fees, GST and slippage come on top. The default is 30 bp.</p>
<p class="note" id="ml-note" aria-live="polite"></p>
<h3>Growth of ₹1 lakh</h3>
<div id="ml-growth" class="sim-chart tall" role="img" aria-label="Growth of one lakh rupees in the momentum portfolio before and after costs and in the NIFTY ETF, log scale"></div>
<div class="table-scroll"><table class="data compact" id="ml-stats" aria-label="Summary statistics"></table></div>
<h3 id="ml-rank-title">Today’s ranking</h3>
<div class="table-scroll"><table class="data" id="ml-rank"></table></div>
<script>
$js
const ML = $data;
(() => {
  const el = (id) => document.getElementById(id);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  // Undo the page's compact encoding: log price x scale, first value then month-to-month differences.
  const decode = (v) => { let last = null; return v.map((d) => { if (d === null) return null; last = last === null ? d : last + d; return Math.exp(last / ML.scale); }); };
  const syms = ML.symbols, T = ML.dates.length;
  const cols = syms.map((s) => decode(ML.px[s]));
  const px = ML.dates.map((_, t) => cols.map((c) => c[t]));
  const etf = decode(ML.bench.NIFTYBEES), nifty = decode(ML.bench.NIFTY);
  const etfStart = etf.findIndex((v) => v !== null);
  const mom121 = momentum(px, 12, 1);

  // Controls live in the address (#look=12&skip=1&n=20&reb=1&cost=30&period=all) for sharing.
  const allowed = { look: ["3", "6", "12"], skip: ["0", "1"], n: ["10", "20", "30", "50"], reb: ["1", "3", "6"], period: ["all", "10y", "5y"] };
  const ids = { look: "ml-look", skip: "ml-skip", n: "ml-n", reb: "ml-reb", period: "ml-period" };
  const fromHash = new URLSearchParams(location.hash.slice(1));
  for (const [k, id] of Object.entries(ids)) if (allowed[k].includes(fromHash.get(k))) el(id).value = fromHash.get(k);
  const c0 = parseFloat(fromHash.get("cost"));
  if (Number.isFinite(c0) && c0 >= 0 && c0 <= 200) el("ml-cost").value = String(c0);

  const pct = (x) => (x * 100).toFixed(1).replace("-", "−") + "%";
  const lakh = (x) => "₹" + (x / 1e5).toLocaleString("en-IN", { maximumFractionDigits: 2, minimumFractionDigits: 2 }) + " lakh";
  const month = (d) => new Date(d + "T00:00:00Z").toLocaleDateString("en-GB", { month: "short", year: "numeric", timeZone: "UTC" });
  const every = { 1: "monthly", 3: "every 3 months", 6: "every 6 months" };
  const cfg = { displaylogo: false, responsive: true };
  const base = () => ({ paper_bgcolor: css("--surface"), plot_bgcolor: css("--surface"),
    font: { family: getComputedStyle(document.body).fontFamily, color: css("--text-2"), size: 12 },
    margin: { l: 72, r: 16, t: 32, b: 40 }, legend: { orientation: "h", y: 1.02, yanchor: "bottom", x: 0 },
    hovermode: "x unified", xaxis: { gridcolor: css("--grid") } });

  const update = () => {
    const look = +el("ml-look").value, skip = +el("ml-skip").value, n = +el("ml-n").value, reb = +el("ml-reb").value;
    const period = el("ml-period").value;
    const costRaw = parseFloat(el("ml-cost").value);
    const bp = Number.isFinite(costRaw) ? Math.min(200, Math.max(0, costRaw)) : 30;
    history.replaceState(null, "", `#look=${look}&skip=${skip}&n=${n}&reb=${reb}&cost=${bp}&period=${period}`);
    const label = skip ? `${look}-1` : `${look}-month`;
    const score = momentum(px, look, skip);

    // Period: the later of its start and the ETF's first month-end, so both cover the same months.
    let s0 = etfStart;
    if (period !== "all") {
      const from = new Date(ML.dates[T - 1] + "T00:00:00Z");
      from.setUTCFullYear(from.getUTCFullYear() - parseInt(period, 10));
      s0 = Math.max(s0, ML.dates.findIndex((d) => d >= from.toISOString().slice(0, 10)));
    }
    const res = backtest(px.slice(s0), score.slice(s0), n, reb, bp / 1e4);
    const i0 = s0 + res.start, dates = ML.dates.slice(i0);
    const bench = [];
    let lastB = etf[i0];
    for (let i = i0; i < T; i++) { if (etf[i] !== null) lastB = etf[i]; bench.push(lastB / etf[i0]); }
    const benchRet = bench.slice(1).map((v, i) => v / bench[i] - 1);
    const years = (Date.parse(dates[dates.length - 1]) - Date.parse(dates[0])) / (365.25 * 86400000);
    const sum = (v) => v.reduce((a, b) => a + b, 0);
    const rows = [
      ["Growth a year (CAGR)", cagr(res.equityGross, dates), cagr(res.equityNet, dates), cagr(bench, dates)],
      ["Volatility, a year", annualVol(res.gross), annualVol(res.net), annualVol(benchRet)],
      ["Worst drawdown", maxDrawdown(res.equityGross), maxDrawdown(res.equityNet), maxDrawdown(bench)],
      ["Traded a year (buys + sells)", sum(res.turnover) / years, sum(res.turnover) / years, null],
      ["Costs a year", 0, sum(res.cost) / years, null],
    ];
    el("ml-stats").innerHTML = `<thead><tr><th scope="col">${dates.length - 1} months</th><th scope="col">Momentum, before costs</th><th scope="col">Momentum, after costs</th><th scope="col">NIFTY ETF</th></tr></thead><tbody>` +
      rows.map(([k, ...v]) => `<tr><th scope="row">${k}</th>${v.map((x) => `<td>${x === null ? "–" : pct(x)}</td>`).join("")}</tr>`).join("") + "</tbody>";
    const endNet = 1e5 * res.equityNet[res.equityNet.length - 1], endBench = 1e5 * bench[bench.length - 1];
    el("ml-note").textContent = `${label} momentum, top ${n}, rebalanced ${every[reb]}, ${bp} bp a side, ${month(dates[0])} to ${ML.last}: ` +
      `₹1 lakh grew to ${lakh(endNet)} after costs, against ${lakh(endBench)} in the NIFTY ETF.`;

    const t2 = css("--text-2"), ca = css("--accent"), cb = css("--accent-2"), mu = css("--muted");
    Plotly.react("ml-growth", [
      { x: dates, y: res.equityGross.map((v) => 1e5 * v), mode: "lines", line: { color: t2, width: 1.2, dash: "dash" }, name: "momentum, before costs", hovertemplate: "₹%{y:,.0f}" },
      { x: dates, y: res.equityNet.map((v) => 1e5 * v), mode: "lines", line: { color: ca, width: 2 }, name: `momentum, after ${bp} bp a side`, hovertemplate: "₹%{y:,.0f}" },
      { x: dates, y: bench.map((v) => 1e5 * v), mode: "lines", line: { color: cb, width: 2 }, name: "NIFTY ETF (NIFTYBEES)", hovertemplate: "₹%{y:,.0f}" },
      { x: dates, y: dates.map((_, k) => 1e5 * nifty[i0 + k] / nifty[i0]), mode: "lines", line: { color: mu, width: 1 }, name: "NIFTY 50 index, no dividends", visible: "legendonly", hovertemplate: "₹%{y:,.0f}" },
    ], Object.assign(base(), { separators: ".,", yaxis: { type: "log", title: "value, log scale", gridcolor: css("--grid"), tickprefix: "₹", tickformat: ",.0f" } }), cfg);

    // Today's ranking: the latest row of the selected score, among stocks priced that day.
    const last = T - 1;
    const ranked = syms.map((s, j) => j).filter((j) => score[last][j] !== null && px[last][j] !== null)
      .sort((a, b) => score[last][b] - score[last][a]).slice(0, 30);
    const extra = label !== "12-1";
    el("ml-rank-title").textContent = `Today’s ranking: top 30 by ${label} return, at ${ML.last}`;
    el("ml-rank").innerHTML = `<thead><tr><th scope="col">Rank</th><th scope="col"><span class="text">Symbol</span></th><th scope="col"><span class="text">Industry</span></th>` +
      (extra ? `<th scope="col">${label} return</th>` : "") + `<th scope="col">12-1 return</th></tr></thead><tbody>` +
      ranked.map((j, k) => `<tr><td>${k + 1}</td><td class="text">${syms[j]}</td><td class="text">${ML.industries[syms[j]]}</td>` +
        (extra ? `<td>${pct(score[last][j])}</td>` : "") + `<td>${mom121[last][j] === null ? "–" : pct(mom121[last][j])}</td></tr>`).join("") + "</tbody>";
  };
  el("ml").addEventListener("change", update);
  el("ml").addEventListener("input", (e) => { if (e.target.type === "number") update(); });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", update);
  update();
})();
</script>
